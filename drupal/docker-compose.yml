# Drupal11, MariaDB, Adminer
#
# Access via "http://localhost:8080"
#   (or "http://$(docker-machine ip):8080" if using docker-machine)
#
# SQL Server Name: mariadb_d11
# SQL Root Password: mariadb
# SQL Database: drupal11
# SQL User: drupal11
# SQL Password: drupal11
#

services:

  drupal:
    image: drupal:11-apache
    container_name: drupal11
    ports:
      - "8080:80"
    restart: always
    volumes:
      - type: bind
        source: ./themes
        target: /var/www/html/themes
      - type: bind
        source: ./modules
        target: /var/www/html/modules

  adminer:
    container_name: adminer_d11
    image: adminer
    restart: always
    ports:
      - "8081:8080"
    environment: 
      - ADMINER_DEFAULT_SERVER=mariadb_d11
     
  mariadb:
    image: mariadb
    container_name: mariadb_d11
    stop_grace_period: 30s
    working_dir: /host
    volumes:
      - ./db:/host
    environment:
      - MYSQL_ROOT_PASSWORD=mariadb
      - MYSQL_DATABASE=drupal11
      - MYSQL_USER=drupal11
      - MYSQL_PASSWORD=drupal11
    restart: always
